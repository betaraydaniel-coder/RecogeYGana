name: Request Unity License (one-time setup)

# Ejecuta este workflow UNA SOLA VEZ para obtener tu archivo .alf,
# que se usa para activar tu cuenta Unity Personal gratuita y obtener el .ulf.
#
# Pasos:
#   1. En GitHub, ve a Actions → "Request Unity License (one-time setup)"
#      → Run workflow.
#   2. Cuando termine, descarga el artefacto "Unity_v2022.x.alf".
#   3. Ve a https://license.unity3d.com/manual y sube ese .alf.
#   4. Selecciona "Unity Personal" → descarga el archivo .ulf resultante.
#   5. En tu repo: Settings → Secrets and variables → Actions → New secret:
#         UNITY_LICENSE  →  pega el contenido COMPLETO del .ulf
#         UNITY_EMAIL    →  tu email de Unity
#         UNITY_PASSWORD →  tu contraseña de Unity
#   6. Ahora puedes correr "Build Windows64" y el .exe se generará.

on:
  workflow_dispatch:

jobs:
  request-activation-file:
    name: Generate .alf file
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile
        with:
          unityVersion: 2022.3.20f1

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
